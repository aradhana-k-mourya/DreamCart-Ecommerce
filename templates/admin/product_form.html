{% extends 'base.html' %}
{% block content %}
<section class="admin-form-page">
  <a class="under-link" href="{{ url_for('admin_products') }}">← Back to products</a>
  <span class="eyebrow">THE SHOP FLOOR</span>
  <h1>{{ 'Edit this find' if product else 'Add a good thing' }}</h1>
  <form method="post" enctype="multipart/form-data" class="product-admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Product name<input name="name" required value="{{ product.name if product else '' }}"></label>
    <label>Category
      <select name="category_id" required>
        {% for c in categories %}
        <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="field-pair">
      <label>Price (₹)<input name="price" type="number" min="1" step="0.01" required value="{{ product.price if product else '' }}"></label>
      <label>Discount (%)<input name="discount" type="number" min="0" max="90" value="{{ product.discount if product else 0 }}"></label>
    </div>
    <label>Stock<input name="stock" type="number" min="0" required value="{{ product.stock if product else 0 }}"></label>
    <label>Description<textarea name="description" rows="5">{{ product.description if product else '' }}</textarea></label>
    <label>Product image<input name="image" type="file" accept="image/png,image/jpeg,image/webp">
      {% if product and product.image %}<small>Current image: {{ product.image }}</small>{% endif %}
    </label>
    <label class="checkbox-label"><input type="checkbox" name="featured" {% if product and product.featured %}checked{% endif %}> Feature this item on the homepage</label>
    <button class="button button-dark">Save product ↗</button>
  </form>
</section>
{% endblock %}
