{% extends 'base.html' %}{% block title %}Choose a new password — DreamCart{%
endblock %}{% block content %}
<section class="auth-wrap">
  <div class="auth-aside">
    <span class="eyebrow">A FRESH START</span>
    <h1>Make it<br /><i>yours again.</i></h1>
    <p>Choose a new password to get back to your DreamCart account.</p>
    <span class="auth-decoration">✳</span>
  </div>
  <div class="auth-card">
    <span class="eyebrow">ACCOUNT HELP</span>
    <h2>Choose a new password.</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" /><label
        >New password<input
          name="password"
          type="password"
          required
          minlength="8"
          autocomplete="new-password" /></label
      ><label
        >Confirm password<input
          name="confirm_password"
          type="password"
          required
          minlength="8"
          autocomplete="new-password" /></label
      ><button class="button button-dark full">Update password ↗</button>
    </form>
  </div>
</section>
{% endblock %}
